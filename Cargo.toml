[workspace]

# NB: wgpu blows up without this resolver, and it must be set at the workspace root rather than leaf projects.
resolver = "2"

members = [
    # Shared library crates
    "crates/lib/model-serde",

    # Application crates
    "crates/app/fakeyou-recast",
    "crates/app/model-packager",
]
