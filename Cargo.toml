[workspace]

members = [
    # Shared library crates
    "crates/lib/model-serde",

    # Application crates
    "crates/app/fakeyou-recast",
    "crates/app/model-packager",
]

# Settings that must be set at the workspace level rather than leaf projects:

resolver = "2" # NB: wgpu blows up without this resolver.

[profile.release]
strip = true # NB: Strip debugging symbols to make reverse engineering harder
